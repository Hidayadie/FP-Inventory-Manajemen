<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order — Gin API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <main class="container py-4 py-md-5">
    <header class="mb-4">
      <h1 class="fw-bold">Order</h1>
      <p class="text-body-secondary mb-0">Login menggunakan akun API yang sudah terdaftar. Gunakan ID produk yang tersedia.</p>
    </header>
    <p id="status" class="alert alert-info d-none text-break" role="status" aria-live="polite"></p>
    <div class="row g-4 mb-4">
      <div class="col-lg-4">
        <section class="card shadow-sm h-100" aria-labelledby="login-title">
          <div class="card-body p-4">
            <h2 id="login-title" class="h5 mb-3">Login</h2>
            <form id="login">
              <label class="d-block mb-3">Email<input class="form-control mt-1" name="email" type="email" autocomplete="username" required></label>
              <label class="d-block mb-3">Password<input class="form-control mt-1" name="password" type="password" autocomplete="current-password" required></label>
              <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary">Login</button>
                <button id="logout" class="btn btn-outline-secondary" type="button">Keluar</button>
              </div>
            </form>
          </div>
        </section>
      </div>
      <div class="col-lg-8">
        <section class="card shadow-sm h-100" aria-labelledby="create-title">
          <div class="card-body p-4">
            <h2 id="create-title" class="h5 mb-3">Buat order</h2>
            <form id="create">
              <div id="items" class="mb-3"></div>
              <div class="d-flex flex-wrap gap-2">
                <button id="add" class="btn btn-outline-primary" type="button">Tambah produk</button>
                <button class="btn btn-primary">Kirim order</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
    <section class="card shadow-sm mb-4" aria-labelledby="orders-title">
      <div class="card-body p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 id="orders-title" class="h5 mb-0">Daftar order</h2>
          <button id="refresh" class="btn btn-outline-primary btn-sm" type="button">Muat order</button>
        </div>
        <div class="table-responsive">
          <table id="orders" class="table align-middle mb-0">
            <caption class="caption-top">Nota pesanan beserta rincian produk dan grand total.</caption>
            <thead class="table-light">
              <tr>
                <th scope="col">Produk</th>
                <th scope="col">Jumlah</th>
                <th scope="col">Harga satuan</th>
                <th scope="col">Subtotal</th>
                <th scope="col">Tax Amount</th>
              </tr></thead>
            <tbody><tr><td colspan="5" class="text-center text-body-secondary py-4">Login lalu muat order.</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="card shadow-sm" aria-labelledby="detail-title">
      <div class="card-body p-4">
        <h2 id="detail-title" class="h5 mb-3">Detail order</h2>
        <pre id="detail" class="bg-body-tertiary border rounded p-3 mb-0" tabindex="0" aria-label="Detail order">Pilih order dari daftar.</pre>
      </div>
    </section>
  </main>
  <template id="item-template">
    <div class="item row g-2 align-items-end mb-3">
      <div class="col-6 col-sm-5">
        <label class="d-block">ID produk<input class="form-control mt-1" name="product_id" type="number" min="1" step="1" required></label>
      </div>
      <div class="col-6 col-sm-4">
        <label class="d-block">Jumlah<input class="form-control mt-1" name="quantity" type="number" min="1" step="1" value="1" required></label>
      </div>
      <div class="col-12 col-sm-3">
        <button class="btn btn-outline-danger w-100" type="button">Hapus</button>
      </div>
    </div>
  </template>
  <script>
    const $ = (id) => document.getElementById(id);
    const API_URL = 'http://localhost:8080';
    const rupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' });
    
    function status(message, error = false) {
      $('status').textContent = message;
      $('status').className = `alert ${error ? 'alert-danger' : 'alert-info'} text-break`;
    }
    
    function saveToken(token, maxAge = 0) {
      document.cookie = `client_access_token=${encodeURIComponent(token)}; Path=/; Max-Age=${maxAge}; SameSite=Lax${location.protocol === 'https:' ? '; Secure' : ''}`;
    }
    
    function readToken() {
      const cookie = document.cookie.split('; ').find((entry) => entry.startsWith('client_access_token='));
      try {
        return cookie ? decodeURIComponent(cookie.slice('client_access_token='.length)) : '';
      } catch {
        return '';
      }
    }
    
    async function request(path, body) {
      const headers = {};
      const token = readToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      
      const response = await fetch(`${API_URL}${path}`, {
        method: body === undefined ? 'GET' : 'POST', headers, credentials: 'omit',
        body: body === undefined ? undefined : JSON.stringify(body),
        signal: AbortSignal.timeout(15000)
      });
      const result = await response.json();
      if (!response.ok) {
        if (response.status === 401) saveToken('');
        throw new Error(result.error || `HTTP ${response.status}`);
      }
      return result.data;
    }
    
    async function run(button, action) {
      button.disabled = true;
      status('Memproses…');
      try { await action(); }
      catch (error) { status(error.message, true); }
      finally { button.disabled = false; }
    }
    
    function addItem() {
      const row = $('item-template').content.cloneNode(true);
      row.querySelector('button').onclick = (event) => {
        if ($('items').children.length > 1) event.target.closest('.item').remove();
      };
      $('items').append(row);
    }
    
    function readItems() {
      const items = Array.from($('items').children, (row) => ({
        product_id: Number(row.querySelector('[name="product_id"]').value),
        quantity: Number(row.querySelector('[name="quantity"]').value)
      }));
      if (!items.length || items.some((item) =>
        !Number.isSafeInteger(item.product_id) || item.product_id < 1 ||
        !Number.isSafeInteger(item.quantity) || item.quantity < 1)) {
        throw new Error('ID produk dan jumlah wajib bilangan bulat positif.');
      }
      if (new Set(items.map((item) => item.product_id)).size !== items.length) {
        throw new Error('ID produk tidak boleh duplikat.');
      }
      return items;
    }

   
function renderOrders(orders) {
  const table = $('orders');
  const heading = table.querySelector('thead');
  const caption = table.querySelector('caption');

  table.replaceChildren(caption, heading);

  if (!orders.length) {
    const row = document.createElement('tr');
    const cell = document.createElement('td');

    cell.colSpan = 4;
    cell.className = 'text-center text-body-secondary py-4';
    cell.textContent = 'Belum ada order.';

    row.append(cell);

    const group = document.createElement('tbody');
    group.append(row);
    table.append(group);
    return;
  }

  for (const order of orders) {
    const row = document.createElement('tr');
    row.className = 'table-light';

    const headingCell = document.createElement('th');
    headingCell.scope = 'rowgroup';
    headingCell.colSpan = 4;
    headingCell.textContent =
      `Nota #${order.id} · ${new Date(order.created_at).toLocaleString('id-ID')}`;

    const cell = document.createElement('td');
    const button = document.createElement('button');

    button.textContent = 'Lihat';
    button.className = 'btn btn-outline-primary btn-sm';

    button.onclick = () => run(button, async () => {
      const detail = await request(
        `/api/private/orders/${encodeURIComponent(order.id)}`
      );

      $('detail').textContent = JSON.stringify(detail, null, 2);
      status(`Detail order #${detail.id} dimuat.`);
    });

    cell.append(button);
    row.append(headingCell, cell);

    const group = document.createElement('tbody');
    group.append(row);

    for (const item of order.order_details || []) {
      const itemRow = document.createElement('tr');

      const values = [
        item.product?.name || `Produk #${item.product_id}`,
        item.qty,
        rupiah.format(item.price),
        rupiah.format(item.subtotal ?? (item.price * item.qty)+item.tax_amount),
        rupiah.format(item.tax_amount ?? 0)
      ];

      for (const value of values) {
        const itemCell = document.createElement('td');
        itemCell.textContent = value;
        itemRow.append(itemCell);
      }

      group.append(itemRow);
    }

    const totalRow = document.createElement('tr');
    totalRow.className = 'fw-bold';

    const label = document.createElement('th');
    label.scope = 'row';
    label.colSpan = 4;
    label.textContent = 'Grand total';

    const total = document.createElement('td');
    total.textContent = rupiah.format(order.grand_total ?? 0);

    totalRow.append(label, total);
    group.append(totalRow);

    table.append(group);
  }
}
    
    
    async function loadOrders() {
      const orders = await request('/api/private/orders');
      renderOrders(orders || []);
      status(orders?.length ? `${orders.length} order dimuat.` : 'Belum ada order.');
    }

    $('login').onsubmit = (event) => {
      event.preventDefault();
      run(event.submitter, async () => {
        const form = new FormData(event.target);
        const data = await request('/api/auth/login', { email: form.get('email'), password: form.get('password') });
        if (typeof data?.access_token !== 'string' || !data.access_token || !Number.isSafeInteger(data.expires_in) || data.expires_in <= 0) {
          throw new Error('Respons token login tidak valid.');
        }
        saveToken(data.access_token, data.expires_in);
        event.target.reset();
        await loadOrders();
      });
    };
    $('logout').onclick = () => run($('logout'), async () => {
      saveToken('');
      renderOrders([]);
      $('detail').textContent = 'Pilih order dari daftar.';
      status('Sudah keluar.');
    });
    $('create').onsubmit = (event) => {
      event.preventDefault();
      run(event.submitter, async () => {
        const order = await request('/api/private/orders', { items: readItems() });
        $('detail').textContent = JSON.stringify(order, null, 2);
        $('items').replaceChildren();
        addItem();
        status(`Order #${order.id} berhasil dibuat. Klik Muat order untuk memperbarui daftar.`);
      });
    };
    $('add').onclick = addItem;
    $('refresh').onclick = () => run($('refresh'), loadOrders);
    addItem();
  </script>
</body>
</html>
