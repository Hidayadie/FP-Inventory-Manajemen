
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun | Inventory Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            font-family: Arial, sans-serif;
        }

        .register-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(30, 64, 175, 0.12);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            border-radius: 16px;
            font-size: 28px;
            margin: 0 auto 18px;
        }

        .form-control, .form-select {
            min-height: 45px;
            border-radius: 9px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.12);
        }

        .btn-register {
            min-height: 46px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #1d4ed8;
            color: white;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #64748b;
        }

        .password-wrapper input {
            padding-right: 42px;
        }
    </style>
</head>

<body>
    <div class="register-wrapper">
        <div class="register-card">

            <div class="text-center mb-4">
                <div class="brand-icon">
                    <i class="bi bi-box-seam"></i>
                </div>

                <h3 class="fw-bold mb-2">Buat Akun Baru</h3>
                <p class="text-muted mb-0">
                    Inventory Management System
                </p>
                <p class="text-secondary small mt-2">
                    Lengkapi data berikut untuk membuat akun.
                </p>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">
                        Nama Lengkap
                    </label>
                    <input type="text" class="form-control" id="name"
                    name="name" placeholder="Masukkan nama lengkap"
                    autocomplete="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        Email
                    </label>
                    <input type="email" class="form-control" id="email"
                    name="email" placeholder="nama@email.com"
                    autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control"
                        id="password" name="password"
                        placeholder="Minimal 8 karakter"
                        autocomplete="new-password"
                        minlength="8" required>
                        <button type="button" class="password-toggle"
                        data-target="password"
                        aria-label="Tampilkan password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            

            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold">
                    Konfirmasi Password
                </label>
                <div class="password-wrapper">
                    <input type="password" class="form-control"
                    id="confirmPassword"
                    placeholder="Ulangi password"
                    autocomplete="new-password" required>
                    <button type="button" class="password-toggle"
                    data-target="confirmPassword"
                    aria-label="Tampilkan konfirmasi password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="mb-3">
            <label for="role" class="form-label fw-semibold">
                Role / Hak Akses
            </label>

            <select class="form-select" id="role" name="role" required>
                <option value="" selected disabled>Pilih role akun</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
                <option value="teknisi">Teknisi</option>
            </select>

            <div class="form-text">
                Pilih peran akun sesuai kebutuhan sistem.
            </div>
        </div>

        <button type="submit" class="btn btn-register w-100"
        id="registerButton">
        <i class="bi bi-person-plus me-2"></i>
        Buat Akun
    </button>

    <div class="text-center mt-4">
        <span class="text-muted">Sudah punya akun?</span>
        <a href="login.html"
        class="text-primary fw-semibold text-decoration-none">
        Login
    </a>
</div>
</form>

<div class="text-center mt-4">
    <small class="text-muted">
        &copy; 2026 Inventory Management System
    </small>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // Tampilkan/sembunyikan password
    document.querySelectorAll(".password-toggle").forEach(button => {
        button.addEventListener("click", function () {
            const input = document.getElementById(this.dataset.target);
            const icon = this.querySelector("i");

            input.type = input.type === "password" ? "text" : "password";
            icon.classList.toggle("bi-eye");
            icon.classList.toggle("bi-eye-slash");
        });
    });

    document.getElementById("registerForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            Swal.fire("Validasi", "Password minimal 8 karakter.", "warning");
            return;
        }

        if (password !== confirmPassword) {
            Swal.fire("Validasi", "Konfirmasi password tidak cocok.", "warning");
            return;
        }

        /*
         * Hubungkan ke endpoint registrasi backend Go di sini.
         * Endpoint dan format JSON perlu disesuaikan dengan API kamu.
         */
        Swal.fire({
            icon: "info",
            title: "Form Registrasi Siap",
            text: "Hubungkan form ini ke endpoint registrasi akun pada backend Go."
        });
    });
</script>
</body>
</html>
